interface=p2p0
driver=nl80211
# 无线网络名称（SSID）
ssid=test123
# 工作模式，a 表示 5GHz 频段
hw_mode=g
channel=6
country_code=CN
ieee80211d=1
ieee80211n=1
ieee80211ac=1
wmm_enabled=1
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
# password
wpa_passphrase=12345678
rsn_pairwise=CCMP
# 最大客户端数量（可选）
max_num_sta=8
# 隐藏 SSID（可选，0 为广播 SSID，1 为隐藏）
ignore_broadcast_ssid=0
