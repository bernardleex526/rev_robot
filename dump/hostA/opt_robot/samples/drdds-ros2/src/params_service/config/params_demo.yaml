# ROS2 Parameters Configuration Example
#
# Usage:
#   1. Load parameters: ros2 param load /params_server params_demo.yaml
#   2. View parameters: ros2 param get /params_server device_name
#   3. Get all parameters: ros2 param list /params_server

params_server:
  ros__parameters:
    device_name: "demo_device"
    update_rate: 20
    enable_debug: false
    max_distance: 150.0

params_server_py:
  ros__parameters:
    device_name: "demo_device_py"
    update_rate: 25
    enable_debug: true
    max_distance: 120.5
