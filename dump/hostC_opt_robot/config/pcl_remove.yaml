# ============================================================================
# pcl_remove.yaml - 衔接可通行域地图，累积点云已经降采样（0.05m体素）

# 可通行域输入点云(重力对齐坐标系)范围：
# x: [-4.0, 4.0] # y: [-4.0, 4.0] # z: [-1.0, 0.5]
# ----------------------------------------------------------------------------
# CropBox 内框移除参数（移除机器人本体区域）
# ----------------------------------------------------------------------------
in_minx: -0.45     
in_maxx: 0.45      
in_miny: -0.25     
in_maxy: 0.25      
in_minz: -0.4     
in_maxz: 1.0    

# ----------------------------------------------------------------------------
# VoxelGrid 体素降采样参数（确保消息大小合理）
# ----------------------------------------------------------------------------
leaf_size: 0.05

# ----------------------------------------------------------------------------
# RadiusOutlierRemoval 离群点去除参数，噪声过滤
# ----------------------------------------------------------------------------
serach_radius: 0.1    
minNeighbors: 4    
