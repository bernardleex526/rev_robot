#点云参数

# ----------------------------------------------------------------------------
# PassThrough 外框范围过滤参数
# ----------------------------------------------------------------------------
# 单位：米 (m)
out_minx: -4.0    
out_maxx: 4.0    
out_miny: -4.0    
out_maxy: 4.0   
out_minz: -0.30    
out_maxz: 0.6    

# ----------------------------------------------------------------------------
# CropBox 内框移除参数（移除机器人本体区）
# ----------------------------------------------------------------------------
in_minx: -0.45     
in_maxx: 0.45      
in_miny: -0.25    
in_maxy: 0.25    
in_minz: -0.30     
in_maxz: 0.6   

# ----------------------------------------------------------------------------
# RadiusOutlierRemoval 离群点去除参数（噪声过滤）
# ----------------------------------------------------------------------------
serach_radius: 0.1    # 搜索半径（米），在此半径内查找邻近点
minNeighbors: 4       # 最小邻近点数量，少于此数量的点将被移除

# 降采样体素大小
leaf_size: 0.01